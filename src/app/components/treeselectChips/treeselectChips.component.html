<div [ngClass]="chips.length >0 ? 'p-2 custom-border' : ''" [class.custom-border-error]="error">
    <p-inputgroup>
        <p-floatlabel variant="on" class="custom-floatlabel" [class.invalid-floatlabel]="error">
            <p-treeselect #treeSelect [options]="treeselectOptions" [ngModel]="treeSelection" inputId="{{fieldName}}"
                class="flex z-0 w-full custom-treeselect" (ngModelChange)="treeselectChange($event)" (onClear)="treeSelect.hide()"
                [class.invalid-treeselect]="error" [filter]="true" resetFilterOnHide="true" [virtualScroll]="true" 
                [virtualScrollItemSize]="40" [filterPlaceholder]="'treeselectChips.placeholder' | translate:{fieldName: fieldName}" [showClear]="true"
                [metaKeySelection]="true" selectionMode="checkbox" filter showClear fluid [propagateSelectionDown]="false"
                appendTo="body" panelStyleClass="custom-treeselect" [propagateSelectionUp]="false" [class.addongroup-element]="popoverUsingAddonGroup"
                [virtualScrollOptions]="{ scrollHeight: virtualScrollHeight }" [loading]="treeselectOptions.length == 0">
                <ng-template #filtericon>
                    <i class="pi pi-bookmark"></i>
                </ng-template>
                <ng-template #value>
                    {{'treeselectChips.itemsSelected' | translate: {number: chips.length} }}
                </ng-template>
            </p-treeselect>
            <label for="{{fieldName}}">{{fieldName}}</label>
        </p-floatlabel>
        @if (popoverUsingAddonGroup) {
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-info-circle"
                    severity="secondary"
                    variant="text"
                    (click)="popoverInfo.toggle($event)"
                />
            </p-inputgroup-addon>
        }
    </p-inputgroup>
    <p-popover #popoverInfo>
        <ng-content></ng-content>
    </p-popover>
    <div class="mt-3 flex-wrap gap-2 align-items-center" [style.display]="chips.length == 0 ? 'none' : 'flex'">
        @for (chip of chips; track chip) {
            <p-chip [label]="chip" [removable]="true" (onRemove)="deleteElement(chip)" class="custom-chip"/>
        }
    </div>
</div>
